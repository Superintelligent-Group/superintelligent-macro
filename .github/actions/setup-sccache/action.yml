name: Setup sccache

description: Install sccache and configure it as RUSTC_WRAPPER.

inputs:
  version:
    description: sccache release version to install
    required: false
    default: v0.10.0
  cache-key-prefix:
    description: Prefix for the local GitHub Actions cache key
    required: false
    default: sccache

runs:
  using: composite
  steps:
    - name: Restore local sccache cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/sccache
          ~/.local/bin/sccache
        key: ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/cloud-storage/Cargo.lock', 'rust/sync-service/Cargo.lock') }}-${{ github.job }}-${{ github.run_id }}
        restore-keys: |
          ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('rust/rust-toolchain.toml', 'rust/cloud-storage/Cargo.lock', 'rust/sync-service/Cargo.lock') }}-
          ${{ inputs.cache-key-prefix }}-${{ runner.os }}-${{ runner.arch }}-

    - name: Install sccache
      shell: bash
      env:
        SCCACHE_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail

        install_dir="$HOME/.local/bin"
        mkdir -p "$install_dir"

        sccache_bin="$install_dir/sccache"
        echo "$install_dir" >> "$GITHUB_PATH"
        if [[ -x "$sccache_bin" ]] && "$sccache_bin" --version >/dev/null 2>&1; then
          echo "sccache already installed: $($sccache_bin --version)"
          exit 0
        fi

        os="$(uname -s)"
        arch="$(uname -m)"
        case "${os}-${arch}" in
          Linux-x86_64)
            archive="sccache-${SCCACHE_VERSION}-x86_64-unknown-linux-musl.tar.gz"
            ;;
          Linux-aarch64|Linux-arm64)
            archive="sccache-${SCCACHE_VERSION}-aarch64-unknown-linux-musl.tar.gz"
            ;;
          Darwin-arm64)
            archive="sccache-${SCCACHE_VERSION}-aarch64-apple-darwin.tar.gz"
            ;;
          Darwin-x86_64)
            archive="sccache-${SCCACHE_VERSION}-x86_64-apple-darwin.tar.gz"
            ;;
          *)
            echo "Unsupported platform for sccache: ${os}-${arch}" >&2
            exit 1
            ;;
        esac

        tmp_dir="$(mktemp -d)"
        trap 'rm -rf "$tmp_dir"' EXIT

        basename="${archive%.tar.gz}"
        curl -fsSL "https://github.com/mozilla/sccache/releases/download/${SCCACHE_VERSION}/${archive}" \
          | tar -xz -C "$tmp_dir"
        mv "$tmp_dir/$basename/sccache" "$sccache_bin"
        chmod +x "$sccache_bin"

        echo "Installed sccache: $($sccache_bin --version)"

    - name: Configure sccache
      shell: bash
      run: |
        set -euo pipefail

        sccache_bin="$HOME/.local/bin/sccache"
        cache_dir="$HOME/.cache/sccache"
        mkdir -p "$cache_dir"

        {
          echo "RUSTC_WRAPPER=$sccache_bin"
          echo "SCCACHE_DIR=$cache_dir"
          echo "SCCACHE_CACHE_SIZE=${SCCACHE_CACHE_SIZE:-5G}"
          echo "SCCACHE_BASEDIR=${GITHUB_WORKSPACE:-$PWD}"
        } >> "$GITHUB_ENV"

        # Cloudflare R2-compatible configuration, matching Zed's setup. To enable it,
        # set these repository secrets: R2_ACCOUNT_ID, R2_ACCESS_KEY_ID,
        # R2_SECRET_ACCESS_KEY, and either a variable or secret named SCCACHE_BUCKET.
        if [[ -n "${R2_ACCOUNT_ID:-}" && -n "${R2_ACCESS_KEY_ID:-}" && -n "${R2_SECRET_ACCESS_KEY:-}" && -n "${SCCACHE_BUCKET:-}" ]]; then
          {
            echo "SCCACHE_ENDPOINT=https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com"
            echo "SCCACHE_BUCKET=${SCCACHE_BUCKET}"
            echo "SCCACHE_REGION=auto"
            echo "SCCACHE_S3_KEY_PREFIX=${SCCACHE_S3_KEY_PREFIX:-sccache/}"
            echo "AWS_ACCESS_KEY_ID=${R2_ACCESS_KEY_ID:-}"
            echo "AWS_SECRET_ACCESS_KEY=${R2_SECRET_ACCESS_KEY:-}"
          } >> "$GITHUB_ENV"
          echo "Configured sccache for Cloudflare R2 bucket ${SCCACHE_BUCKET}"
        elif [[ -n "${SCCACHE_BUCKET:-}" && -n "${AWS_ACCESS_KEY_ID:-}" && -n "${AWS_SECRET_ACCESS_KEY:-}" ]]; then
          # Plain S3-compatible configuration.
          {
            echo "SCCACHE_REGION=${SCCACHE_REGION:-us-east-1}"
            echo "SCCACHE_S3_KEY_PREFIX=${SCCACHE_S3_KEY_PREFIX:-sccache/}"
          } >> "$GITHUB_ENV"
          echo "Configured sccache for S3 bucket ${SCCACHE_BUCKET}"
        else
          echo "No remote sccache bucket configured; using local cached sccache directory."
        fi

        "$sccache_bin" --show-stats || true
